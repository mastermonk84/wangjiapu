<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>儒林汪氏世系谱</title>
<meta name="description" content="乐平儒林汪氏世系谱 · 始祖汪路公以下三十一世">
<style>
:root{
  --paper:#f5f0e6; --paper2:#ede5d6; --card:#fbf8f2; --ink:#1e1912; --ink2:#4a4036; --muted:#857865;
  --line:#dcd1bd; --red:#a8322a; --red-soft:#a8322a1a; --gold:#9a7a3c;
  --sky1:#f3ead8; --sky2:#e6eee6; --bark:#4a3a2c; --leaf1:#6f8f5a; --leaf2:#8aa66a; --leaf3:#557a52;
  --hill:#9db0a0; --ground:#d9ccb0; --soil:#cbb994; --sun:#d9614e; --petal:#c8463a;
  --serif:"Songti SC","STSong","Source Han Serif SC","Noto Serif SC","Noto Serif CJK SC","SimSun",serif;
  --kai:"Kaiti SC","STKaiti","KaiTi","BiauKai","Songti SC","STSong",serif;
  --sans:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --tabh:58px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#17140f; --paper2:#201b15; --card:#221d17; --ink:#ede4d3; --ink2:#c9bda8; --muted:#968a76;
  --line:#3a3228; --red:#d0564a; --red-soft:#d0564a22; --gold:#c9a45e;
  --sky1:#141a26; --sky2:#1d2433; --bark:#b9a27f; --leaf1:#5f8a5c; --leaf2:#7aa36d; --leaf3:#4b7350;
  --hill:#2a3342; --ground:#2b261e; --soil:#221d16; --sun:#f1e3b8; --petal:#e2685a; color-scheme:dark;}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);-webkit-text-size-adjust:100%}
body{padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px));min-height:100vh}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.wrap{max-width:760px;margin:0 auto;padding:0 18px}
.hidden{display:none!important}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--paper);background:color-mix(in srgb,var(--paper) 92%,transparent);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:760px;margin:0 auto;display:flex;height:var(--tabh)}
nav.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--kai);font-size:17px;color:var(--muted)}
nav.tabs a small{font-family:var(--sans);font-size:10px;letter-spacing:.06em;text-transform:uppercase}
nav.tabs a.on{color:var(--red)}

/* home */
.hero{padding:56px 0 28px;display:flex;gap:28px;align-items:flex-start}
.vtitle{writing-mode:vertical-rl;font-family:var(--kai);font-size:46px;letter-spacing:.18em;line-height:1.1;margin:0;flex:none}
.seal{display:inline-flex;width:58px;height:58px;border:2.5px solid var(--red);color:var(--red);border-radius:6px;
  font-family:var(--kai);font-size:22px;line-height:1;align-items:center;justify-content:center;writing-mode:vertical-rl;letter-spacing:.05em;
  transform:rotate(-4deg);margin-bottom:18px;background:var(--red-soft)}
.hero .lede{font-size:17px;line-height:1.95;color:var(--ink2);margin:0 0 6px}
.hero .en{font-family:var(--sans);font-size:13px;color:var(--muted);line-height:1.6;margin:10px 0 0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:8px 0 30px}
.stats div{padding:16px 6px;text-align:center}
.stats div+div{border-left:1px solid var(--line)}
.stats b{display:block;font-family:var(--kai);font-size:28px;font-weight:normal;color:var(--red)}
.stats span{font-size:12.5px;color:var(--muted)}
.cta{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:40px}
.cta a{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;display:block}
.cta a b{font-family:var(--kai);font-size:21px;font-weight:normal;display:block;margin-bottom:4px}
.cta a span{font-size:13px;color:var(--muted);line-height:1.5}
.cta a.main{grid-column:1/-1;background:var(--red);border-color:var(--red);color:#fff8ee}
.cta a.main span{color:#fff8eecc}
h2.sec{font-family:var(--kai);font-weight:normal;font-size:24px;margin:40px 0 6px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h2.sec small{font-family:var(--sans);font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
p.note{color:var(--ink2);line-height:1.9;font-size:15px;margin:6px 0 14px}
.timeline{position:relative;margin:18px 0 0;padding-left:26px}
.timeline:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:1px;background:var(--line)}
.tl{position:relative;padding:0 0 20px}
.tl:before{content:"";position:absolute;left:-23px;top:7px;width:9px;height:9px;border-radius:50%;background:var(--paper);border:1.5px solid var(--gold)}
.tl.red:before{background:var(--red);border-color:var(--red)}
.tl .g{font-family:var(--sans);font-size:11px;color:var(--muted);letter-spacing:.05em}
.tl b{font-family:var(--kai);font-weight:normal;font-size:20px;margin-right:6px}
.tl p{margin:3px 0 0;font-size:14px;line-height:1.8;color:var(--ink2)}
/* poem */
.poem{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 16px 16px;margin:16px 0 8px}
.poem .ln{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:6px}
.poem .ch{display:flex;flex-direction:column;align-items:center;padding:8px 0 6px;border-radius:10px}
.poem .ch b{font-family:var(--kai);font-weight:normal;font-size:32px;line-height:1.1}
.poem .ch small{font-family:var(--sans);font-size:10.5px;color:var(--muted);margin-top:3px}
.poem .ch.me{background:var(--red-soft);box-shadow:inset 0 0 0 1.5px var(--red)}
.poem .ch.me b{color:var(--red)}
.poem .ch em{font-style:normal;font-family:var(--sans);font-size:10.5px;color:var(--red);margin-top:2px;text-align:center;line-height:1.3}
.poem .gl{font-family:var(--sans);font-size:12.5px;color:var(--muted);text-align:center;margin:0 0 14px;line-height:1.5}
.quote{border-left:3px solid var(--red);padding:2px 0 2px 14px;margin:14px 0;font-family:var(--kai);font-size:17px;line-height:1.8;color:var(--ink2)}
.quote small{display:block;font-family:var(--sans);font-size:12px;color:var(--muted)}
footer{padding:36px 0 30px;color:var(--muted);font-size:12.5px;line-height:1.8;font-family:var(--sans);border-top:1px solid var(--line);margin-top:40px}

/* direct line */
.ladder{margin:20px 0 30px;position:relative}
.rung{display:flex;align-items:center;gap:14px;padding:9px 6px;border-radius:10px;position:relative}
.rung:hover{background:var(--paper2)}
.rung .num{width:64px;flex:none;text-align:right;font-family:var(--kai);color:var(--muted);font-size:15px}
.rung .dot{width:11px;height:11px;border-radius:50%;background:var(--red);flex:none;position:relative;z-index:1;box-shadow:0 0 0 4px var(--paper)}
.rung.pre .dot{background:var(--paper);border:1.5px solid var(--gold)}
.rung .nm{font-family:var(--kai);font-size:22px;min-width:0;overflow-wrap:anywhere}
.rung .zb{font-family:var(--kai);font-size:13px;color:var(--gold);border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:3px}
.rung .sub{font-family:var(--sans);font-size:12px;color:var(--muted);margin-left:auto;text-align:right;flex:none}
.ladder:before{content:"";position:absolute;left:89px;top:20px;bottom:20px;width:1.5px;background:linear-gradient(var(--gold),var(--red) 18%,var(--red))}
.gap{padding:4px 0 4px 104px;font-size:12px;color:var(--muted);font-family:var(--sans)}

/* person */
.crumbs{display:flex;flex-wrap:wrap;gap:4px 2px;padding:18px 0 6px;font-size:14px;color:var(--muted);align-items:center}
.crumbs a{padding:3px 6px;border-radius:6px}
.crumbs a:hover{background:var(--paper2);color:var(--ink)}
.crumbs a.d{color:var(--red)}
.crumbs .sep{opacity:.5;font-size:11px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 22px 20px;margin:10px 0 18px;position:relative;overflow:hidden}
.pcard .gen{font-family:var(--kai);color:var(--muted);font-size:16px}
.pcard h1{font-family:var(--kai);font-weight:normal;font-size:52px;margin:4px 0 2px;letter-spacing:.06em;line-height:1.15;padding-right:44px;overflow-wrap:anywhere}
.pcard .ann{display:inline-block;font-size:14px;color:var(--gold);margin:2px 0 8px}
.pcard .stamp{position:absolute;right:20px;top:22px;border:2px solid var(--red);color:var(--red);font-family:var(--kai);font-size:15px;padding:6px 5px;writing-mode:vertical-rl;border-radius:4px;transform:rotate(5deg);background:var(--red-soft)}
.pcard .facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--ink2);margin-top:10px}
.pcard .facts a{color:var(--red);border-bottom:1px solid var(--red-soft)}
.pcard .bio{margin:14px 0 0;padding-top:14px;border-top:1px dashed var(--line);font-size:15px;line-height:1.9;color:var(--ink2)}
.pcard .warn{margin-top:12px;font-size:13px;color:var(--muted);line-height:1.7;background:var(--paper2);border-radius:8px;padding:8px 10px}
.pcard .acts{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:14px;background:var(--paper);display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--ink2)}
.btn.r{color:var(--red);border-color:var(--red)}
.tag{font-family:var(--sans);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--muted);vertical-align:middle}
h3.lab{font-family:var(--kai);font-weight:normal;font-size:18px;margin:22px 0 10px;color:var(--ink2);display:flex;gap:8px;align-items:baseline}
h3.lab small{font-family:var(--sans);font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--kai);font-size:18px;padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.chip.cur{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.d{border-color:var(--red);color:var(--red)}
.kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kid{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:block;transition:transform .12s;min-width:0}
.kid:active{transform:scale(.98)}
.kid b{font-family:var(--kai);font-weight:normal;font-size:22px;display:block;overflow-wrap:anywhere}
.kid i{font-style:normal;font-size:12px;color:var(--gold);display:block;line-height:1.5;overflow-wrap:anywhere}
.kid span{font-family:var(--sans);font-size:11.5px;color:var(--muted)}
.kid.d{border-color:var(--red);box-shadow:inset 3px 0 0 var(--red)}
.empty{color:var(--muted);font-size:14px;padding:6px 0}

/* search */
.sbox{position:sticky;top:0;z-index:5;background:var(--paper);padding:18px 0 10px}
.sbox input{width:100%;font:inherit;font-size:19px;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);outline:none}
.sbox input:focus{border-color:var(--red)}
.gens{display:flex;gap:6px;flex-wrap:wrap;padding:10px 0 4px}
.gens button{flex:none;font-size:13px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-family:var(--sans)}
.gens button.on{background:var(--red);border-color:var(--red);color:#fff}
.res{list-style:none;margin:0;padding:0}
.res li a{display:flex;gap:12px;align-items:baseline;padding:12px 4px;border-bottom:1px solid var(--line)}
.res li b{font-family:var(--kai);font-weight:normal;font-size:21px;min-width:3.5em}
.res li b.d{color:var(--red)}
.res li .meta{font-size:13px;color:var(--muted);line-height:1.6;min-width:0;overflow-wrap:anywhere}
.res li .meta i{font-style:normal;color:var(--gold)}
.res-head{font-size:13px;color:var(--muted);font-family:var(--sans);padding:6px 0}
mark{background:var(--red-soft);color:var(--red)}

/* map + tree */
#map{position:fixed;inset:0 0 calc(var(--tabh) + env(safe-area-inset-bottom,0px)) 0;touch-action:none;background:var(--paper);overflow:hidden}
#map svg{width:100%;height:100%;display:block;cursor:grab;-webkit-user-select:none;user-select:none}
#map svg text{font-family:var(--kai)}
.chart text{font-size:13px;fill:var(--ink)}
.chart text.d{fill:var(--red);font-size:15px}
.chart text.gl{font-family:var(--sans);font-size:11px;fill:var(--muted)}
.chart .lk{fill:none;stroke:var(--line);stroke-width:1}
.chart .lk.d{stroke:var(--red);stroke-width:2}
.chart circle{fill:var(--gold)}
.chart circle.d{fill:var(--red)}
.chart .hl{fill:var(--red-soft);stroke:var(--red)}
.tree .br{fill:none;stroke:var(--bark);stroke-linecap:round}
.tree .thread{fill:none;stroke:var(--petal);stroke-width:2.2;stroke-linecap:round;opacity:.9}
.tree .lf1{fill:var(--leaf1)} .tree .lf2{fill:var(--leaf2)} .tree .lf3{fill:var(--leaf3)}
.tree .leaf{opacity:.88}
.tree .lb{font-size:12px;fill:var(--ink);paint-order:stroke;stroke:var(--sky2);stroke-width:2.5px;stroke-linejoin:round}
.tree .lb.f{fill:var(--red)}
.tree .dl{font-size:28px;fill:var(--ink);paint-order:stroke;stroke:var(--sky1);stroke-width:5px;stroke-linejoin:round}
.tree .dl.kid{font-size:58px;fill:var(--red)}
.tree .dl.kid tspan{font-size:30px;font-family:var(--sans)}
.tree .root{fill:none;stroke:var(--bark);stroke-linecap:round;opacity:.55}
.tree .anc{font-size:32px;fill:var(--ink2)}
.tree .anc2{font-size:16px;fill:var(--muted);font-family:var(--sans)!important}
.tree .petal{fill:var(--petal)} .tree .stamen{fill:#f3d27a}
.tree .ttl{font-size:110px;fill:var(--ink);letter-spacing:.2em}
.tree .ttl2{font-size:30px;fill:var(--muted);font-family:var(--sans)!important;letter-spacing:.1em}
.tree.far .lb{display:none}
.mapui{position:absolute;right:14px;top:calc(14px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.mapui button{min-width:42px;height:42px;padding:0 10px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:17px;box-shadow:0 2px 8px #0001;font-family:var(--kai)}
.mapui button.wide{font-size:15px}
.maphint{position:absolute;left:14px;top:calc(14px + env(safe-area-inset-top,0px));background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--muted);max-width:calc(100% - 110px);line-height:1.5}

/* modal + toast */
.modal{position:fixed;inset:0;z-index:40;background:#0006;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px))}
@media(min-width:600px){.modal{align-items:center}.sheet{border-radius:18px}}
.sheet h3{font-family:var(--kai);font-weight:normal;font-size:22px;margin:0 0 6px}
.sheet p{font-size:14px;color:var(--ink2);line-height:1.7;margin:0 0 12px}
.sheet textarea{width:100%;min-height:150px;font:inherit;font-size:15px;line-height:1.7;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);resize:vertical}
.sheet .row{display:flex;gap:10px;justify-content:flex-end;margin-top:12px}
.toast{position:fixed;left:50%;bottom:calc(var(--tabh) + 20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:14px;z-index:50;font-family:var(--sans)}

@media (max-width:520px){
  .hero{padding-top:36px;gap:18px}
  .vtitle{font-size:36px}
  .pcard h1{font-size:44px}
  .stats{grid-template-columns:repeat(2,1fr)}
  .stats div:nth-child(3){border-left:0}
  .stats div:nth-child(n+3){border-top:1px solid var(--line)}
  .poem .ch b{font-size:27px}
  .rung .num{width:52px;font-size:14px}
  .ladder:before{left:77px}
  .gap{padding-left:92px}
}
</style>
</head>
<body>
<main id="view"></main>
<div id="map" class="hidden"></div>
<nav class="tabs"><div class="in">
  <a href="#/" data-t="home">谱序<small>Home</small></a>
  <a href="#/line" data-t="line">直系<small>Our line</small></a>
  <a href="#/p/0" data-t="p">世系<small>Explore</small></a>
  <a href="#/tree" data-t="map">家树<small>Tree</small></a>
  <a href="#/search" data-t="search">寻人<small>Search</small></a>

function poemHTML(){
  const mine = {27:'新飞', 28:'思玥 乐康'};
  let h='<div class="poem">';
  for(let l=0;l<4;l++){
    h+='<div class="ln">';
    for(let i=0;i<5;i++){ const g=18+l*5+i, c=POEM[l*5+i];
      h+=`<div class="ch ${mine[g]?'me':''}"><b>${c}</b><small>${g}世</small>${mine[g]?`<em>${mine[g]}</em>`:''}</div>`; }

}

function line(){
  const ch = chain(ME).concat(ME.kids.map(k=>P[k]));
  const pre = [['鲁成公','第1代',''],['汪文和','第31代','江南汪姓始祖'],['汪华','第44代','越国公'],['爽公','第45代','汪华第七子']];
  let h = `<div class="wrap"><h2 class="sec" style="margin-top:28px">直系 <small>From Wang Lu to today</small></h2>
  <p class="note">自汪路公至思玥、乐康，二十八世一线相承。框中小字为该世辈份字。点选任一代，可见其兄弟子侄。</p><div class="ladder">`;
  pre.forEach(([n,g,s],i)=>{ h+=`<div class="rung pre"><span class="num">${g}</span><span class="dot"></span><span class="nm" style="color:var(--muted)">${n}</span><span class="sub">${s}</span></div>`;
    if(i===pre.length-1) h+=`<div class="gap">⋯ 居婺源二十余代 ⋯</div>`; });
  ch.forEach(p=>{ const z=zibei(p.gen); h+=`<a class="rung" href="#/p/${p.id}"><span class="num">${shi(p.gen)}</span><span class="dot"></span><span class="nm">${esc(label(p))}${z?`<span class="zb">${z}</span>`:''}</span><span class="sub">${kidWord(p)}${p.desc?'<br>后裔 '+p.desc:''}</span></a>`; });
  return h+`</div></div>`;
}

  const gens = [...new Set(P.map(p=>p.gen))].sort((a,b)=>a-b);

let curGen=0;
function setGen(g){ curGen=g; document.querySelectorAll('.gens button').forEach(b=>b.classList.toggle('on',+b.dataset.g===g)); doSearch(); }
function doSearch(){
  const raw = ($('#q')||{}).value||''; const q = norm(raw.trim());
  history.replaceState(null,'','#/search'+(raw||curGen?`?q=${encodeURIComponent(raw)}&g=${curGen}`:''));
  const r = P.filter(p=>(!curGen||p.gen===curGen) && (!q || p.key.includes(q)));
  const box=$('#results'); if(!box) return;
  if(!q && !curGen){ box.innerHTML=`<p class="note" style="margin-top:14px">可输入单字查找同辈，如“振”“家”；繁体、简体皆可。也可点上方世次，浏览该世全部人名。</p>`; return; }
  r.sort((a,b)=>b.direct-a.direct||a.gen-b.gen);
  const hi = s=>{ if(!q) return esc(s); const n=norm(s); const i=n.indexOf(q); return i<0?esc(s):esc(s.slice(0,i))+'<mark>'+esc(s.slice(i,i+q.length))+'</mark>'+esc(s.slice(i+q.length)); };
  box.innerHTML = `<div class="res-head">找到 ${r.length} 人</div><ul class="res">`+r.map(p=>{
    const path=chain(p).slice(1,-1).map(x=>x.name).join(' › ');
    return `<li><a href="#/p/${p.id}"><b class="${p.direct?'d':''}">${hi(p.name)}</b><span class="meta">${shi(p.gen)}${p.note?' · <i>'+hi(p.note)+'</i>':''}<br>${p.gen>1?'汪路 › ':''}${esc(path)}</span></a></li>`; }).join('')+`</ul>`;
}

  <textarea id="nt">${esc(txt)}</textarea><div class="row"><button class="btn" id="nc">取消</button><button class="btn r" id="ncp">复制</button></div></div>`;
  document.body.appendChild(m);
  const ta=m.querySelector('textarea'); ta.focus(); ta.setSelectionRange(ta.value.length,ta.value.length);
  m.onclick=e=>{ if(e.target===m) m.remove(); };
  m.querySelector('#nc').onclick=()=>m.remove();
  m.querySelector('#ncp').onclick=async()=>{
    let ok=false; try{ await navigator.clipboard.writeText(ta.value); ok=true; }catch(e){}
    if(!ok){ ta.select(); try{ ok=document.execCommand('copy'); }catch(e){} }
    if(ok){ m.remove(); toast('已复制，请到微信粘贴发送'); } else toast('请长按文字，手动复制');
  };
}

/* ---------- pan / zoom (shared by tree and chart) ---------- */
function panzoom(svg, onView){
  let vb={x:0,y:0,w:100,h:100};
  const set=()=>{ svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`); onView&&onView(svg.getBoundingClientRect().width/vb.w); };
  const zoomAt=(f,cx,cy)=>{ const r=svg.getBoundingClientRect(); if(cx==null){cx=r.left+r.width/2;cy=r.top+r.height/2;}
    const k=vb.w/r.width, wx=vb.x+(cx-r.left)*k, wy=vb.y+(cy-r.top)*k; vb.w*=f; vb.h*=f; const k2=vb.w/r.width; vb.x=wx-(cx-r.left)*k2; vb.y=wy-(cy-r.top)*k2; set(); };
  const fit=(cx,cy,w,h)=>{ const r=svg.getBoundingClientRect(); const a=r.width/r.height; if(w/h>a) h=w/a; else w=h*a; vb={x:cx-w/2,y:cy-h/2,w,h}; set(); };
  const pts=new Map(); let start=null, moved=false;
  const snap=()=>({vb:{...vb},pts:new Map([...pts].map(([k,v])=>[k,{...v}]))});
  svg.addEventListener('pointerdown',e=>{ svg.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); if(pts.size===1) moved=false; start=snap(); });
  svg.addEventListener('pointermove',e=>{ if(!pts.has(e.pointerId)) return; pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const r=svg.getBoundingClientRect(), s=start; const arr=[...pts.values()], arr0=[...s.pts.values()];
    if(arr.length===1 && arr0.length===1){ const dx=arr[0].x-arr0[0].x, dy=arr[0].y-arr0[0].y; if(Math.hypot(dx,dy)>6) moved=true; if(!moved) return;
      const k=s.vb.w/r.width; vb.x=s.vb.x-dx*k; vb.y=s.vb.y-dy*k; set(); }
    else if(arr.length>=2 && arr0.length>=2){ moved=true;
      const d0=Math.hypot(arr0[0].x-arr0[1].x,arr0[0].y-arr0[1].y), d1=Math.hypot(arr[0].x-arr[1].x,arr[0].y-arr[1].y);
      const c0={x:(arr0[0].x+arr0[1].x)/2-r.left,y:(arr0[0].y+arr0[1].y)/2-r.top}, c1={x:(arr[0].x+arr[1].x)/2-r.left,y:(arr[0].y+arr[1].y)/2-r.top};
      const f=d0/d1, k0=s.vb.w/r.width; const wx=s.vb.x+c0.x*k0, wy=s.vb.y+c0.y*k0;
      vb.w=s.vb.w*f; vb.h=s.vb.h*f; const k1=vb.w/r.width; vb.x=wx-c1.x*k1; vb.y=wy-c1.y*k1; set(); }
  });
  const up=e=>{ pts.delete(e.pointerId); start=snap();
    if(!moved && e.type==='pointerup' && pts.size===0){ let t=document.elementFromPoint(e.clientX,e.clientY);
      while(t && t!==svg && !(t.dataset&&t.dataset.id)) t=t.parentNode;
      if(t && t.dataset && t.dataset.id) location.hash='#/p/'+t.dataset.id; } };
  svg.addEventListener('pointerup',up); svg.addEventListener('pointercancel',up);
  svg.addEventListener('wheel',e=>{ e.preventDefault(); zoomAt(Math.exp(e.deltaY*0.0015),e.clientX,e.clientY); },{passive:false});
  return {zoomAt, fit, scale:()=>svg.getBoundingClientRect().width/vb.w};
}

/* ---------- 家树 : the family as a tree ---------- */
let tree=null;
function buildTree(){
  // Crown model: every branch tip sits on a dome-shaped crown; each branch then grows from its parent
  // toward the middle of its own tips, one step per generation. Our line grows straight up the trunk.
  const H=760, CY=2300, A=2900, B=1800, SPAN=Math.PI*1.0;
  // leaf counts decide how much of the canopy each branch gets
  const nl=[]; for(let i=P.length-1;i>=0;i--){ const p=P[i]; nl[i]=p.kids.length?p.kids.reduce((s,k)=>s+nl[k],0):1; }
  // arrange siblings centre-out: our line (or the biggest branch) in the middle, then alternate left/right.
  // Along our line the small side-branches sit next to the trunk, so short lineages stay compact instead of flung to the edges.
  const ord=p=>{ if(p.kids.length<2) return p.kids;
    const d=p.kids.filter(i=>P[i].direct), o=p.kids.filter(i=>!P[i].direct);
    o.sort((a,b)=> d.length ? nl[a]-nl[b] : nl[b]-nl[a]);
    const seq=d.length?d.concat(o):o, L=[], R=[]; seq.forEach((k,i)=>{ if(i===0) return; (i%2?R:L).push(k); });
    return L.reverse().concat([seq[0]],R); };
  let n=0; const lf={};
  (function w(id){ const k=ord(P[id]); if(!k.length){ lf[id]=n++; return; } k.forEach(w); lf[id]=(lf[k[0]]+lf[k[k.length-1]])/2; })(0);
  const kidsMid = ME.kids.reduce((s,k)=>s+lf[k],0)/ME.kids.length/(n-1);
  const maxG = Math.max(...P.map(p=>p.gen));
  const cen=[], ht=[];
  for(let i=P.length-1;i>=0;i--){ const p=P[i];
    if(!p.kids.length){ const th=(lf[i]/(n-1)-kidsMid)*SPAN, rf=P[p.parent]===ME?1.02:0.4+0.6*(p.gen-2)/(maxG-2);
      // shallow lineages end lower and closer in, like the lower limbs of a real tree
      cen[i]=[A*rf*Math.sin(th), -CY*(0.55+0.45*rf)-B*rf*Math.cos(th)]; ht[i]=0; }
    else { let x=0,y=0; p.kids.forEach(k=>{ x+=cen[k][0]*nl[k]; y+=cen[k][1]*nl[k]; }); cen[i]=[x/nl[i],y/nl[i]]; ht[i]=1+Math.max(...p.kids.map(k=>ht[k])); } }
  const pos=[], dir=[];
  pos[0]=[0,0]; dir[0]=[0,-1];
  for(let i=1;i<P.length;i++){ const p=P[i], base = p.gen===2 ? [0,-H] : pos[p.parent], c=cen[i], s=Math.min(1, 2.4/(ht[i]+2.4));
    pos[i]=[base[0]+(c[0]-base[0])*s, base[1]+(c[1]-base[1])*s];
    const dx=pos[i][0]-pos[p.parent][0], dy=pos[i][1]-pos[p.parent][1], l=Math.hypot(dx,dy)||1; dir[i]=[dx/l,dy/l]; }
  // the two children at the very top get a blossom each, side by side
  ME.kids.forEach((k,i)=>{ const [x,y]=pos[ME.id], s=ME.kids.length>1?(i?1:-1):0; pos[k]=[x+s*90, y-170];
    const dx=pos[k][0]-x, dy=pos[k][1]-y, l=Math.hypot(dx,dy); dir[k]=[dx/l,dy/l]; });
  const pt = id => pos[id];
  const ang = id => Math.atan2(dir[id][0], -dir[id][1]);
  const u = a => [Math.sin(a), -Math.cos(a)];
  const Rmax = A;
  const f1=v=>v.toFixed(1);
  const width = id => 1.3 + Math.sqrt(P[id].desc+1)*1.9 + Math.max(0,14-P[id].gen)*0.5;
  // deterministic jitter so the drawing is the same every time
  const rnd = i => { const x=Math.sin(i*12.9898)*43758.5453; return x-Math.floor(x); };

  let br='', thread='', leaves='', labels='', blossoms='', clouds='';
  const order = P.filter(p=>p.parent>=0).sort((a,b)=>width(b.id)-width(a.id));
  order.forEach(c=>{
    const p=P[c.parent], [px,py]=pt(p.id), [cx,cy]=pt(c.id), uc=dir[c.id], up=dir[p.id];
    const L=Math.hypot(cx-px,cy-py)*0.42;
    let c1, c2;
    if(p.gen===1){ c1=[0,-H*0.9]; c2=[cx-uc[0]*L*0.5, cy-uc[1]*L*0.5]; }
    else { c1=[px+up[0]*L, py+up[1]*L]; c2=[cx-uc[0]*L*0.5, cy-uc[1]*L*0.5]; }
    const d=`M${f1(px)},${f1(py)}C${f1(c1[0])},${f1(c1[1])} ${f1(c2[0])},${f1(c2[1])} ${f1(cx)},${f1(cy)}`;
    br+=`<path class="br" d="${d}" stroke-width="${f1(width(c.id))}"/>`;
    if(c.direct) thread+=`<path class="thread" d="${d}"/>`;
    // a couple of small leaves along each young twig
    if(c.gen>=8){ const t=0.55, mx=(px+cx)/2*0.4+c2[0]*0.6, my=(py+cy)/2*0.4+c2[1]*0.6, side=rnd(c.id)>0.5?1:-1;
      const a=ang(c.id)*180/Math.PI + side*(40+rnd(c.id+7)*25);
      leaves+=`<ellipse class="leaf lf${1+(c.id%3)}" rx="11" ry="4.6" transform="translate(${f1(mx)},${f1(my)}) rotate(${f1(a-90)})"/>`; }
  });
  // leaves at every branch tip, labels on everyone
  P.forEach(p=>{
    if(p.gen===1) return;
    const [x,y]=pt(p.id), a=ang(p.id), deg=a*180/Math.PI, uu=u(a);
    if(!p.kids.length){
      clouds+=`<circle cx="${f1(x+uu[0]*10)}" cy="${f1(y+uu[1]*10)}" r="${f1(64+rnd(p.id)*40)}" class="lf${1+(p.id%3)}" opacity=".085"/>`;
      for(let j=0;j<5;j++){ const sp=(j-2)*26+(rnd(p.id*5+j)-.5)*14, len=11+rnd(p.id+j)*6;
        const lx=x+uu[0]*4+Math.sin(a+sp*Math.PI/180)*len*0.6, ly=y+uu[1]*4-Math.cos(a+sp*Math.PI/180)*len*0.6;
        leaves+=`<ellipse class="leaf lf${1+((p.id+j)%3)}" rx="${f1(len)}" ry="${f1(len*0.42)}" transform="translate(${f1(lx)},${f1(ly)}) rotate(${f1(deg+sp-90)})" data-id="${p.id}"/>`; }
    }
    if(p.direct || P[p.parent]===ME) return;
    const tx=x+uu[0]*(p.kids.length?8:20), ty=y+uu[1]*(p.kids.length?8:20);
    const rot = a>=0 ? deg-90 : deg+90, anchor = a>=0?'start':'end';
    labels+=`<text class="lb${p.female?' f':''}" data-id="${p.id}" text-anchor="${anchor}" dominant-baseline="central" transform="translate(${f1(tx)},${f1(ty)}) rotate(${f1(rot)})">${esc(label(p))}</text>`;
  });
  // plum blossoms along our own line; the biggest for the children at the top
  const flower=(x,y,s,id)=>{ let f=`<g data-id="${id}" transform="translate(${f1(x)},${f1(y)}) scale(${s})">`;
    for(let k=0;k<5;k++){ const t=k*72*Math.PI/180; f+=`<circle class="petal" cx="${f1(Math.sin(t)*5.2)}" cy="${f1(-Math.cos(t)*5.2)}" r="4.6"/>`; }
    return f+`<circle class="stamen" r="2.6"/></g>`; };
  let dlabels='';
  chain(ME).concat(ME.kids.map(k=>P[k])).forEach(p=>{
    const [x,y]=pt(p.id), isKid=P[p.parent]===ME;
    if(p.gen>1) blossoms+=flower(x,y,isKid?3.6:1.8,p.id);
    if(isKid){ const side = p.id===ME.kids[0]?-1:1;
      dlabels+=`<text class="dl kid" data-id="${p.id}" text-anchor="${side<0?'end':'start'}" x="${f1(x+side*44)}" y="${f1(y-52)}">${esc(p.name)} <tspan>${esc(p.note)}</tspan></text>`; }
    else if(p.gen>1){ const side = ang(p.id)>=0?1:-1;
      dlabels+=`<text class="dl" data-id="${p.id}" text-anchor="${side>0?'start':'end'}" dominant-baseline="central" x="${f1(x+side*20)}" y="${f1(y)}">${esc(p.name)}</text>`; }
  });

  // roots, with the ancestors before 汪路 written along them
  const anc=[['爽公','汪姓第45代 · 汪华第七子'],['汪华','汪姓第44代 · 越国公'],['汪文和','汪姓第31代 · 江南始祖'],['鲁成公','汪姓第1代']];
  let roots='';
  [[-1,.9],[1,.85],[-.55,1.4],[.6,1.3],[-1.6,.6],[1.5,.55],[0,1.8]].forEach(([dx,dy],i)=>{
    const ex=dx*260, ey=dy*240; roots+=`<path class="root" stroke-width="${f1(22-i*2.2)}" d="M0,0C${f1(dx*20)},${f1(ey*0.45)} ${f1(ex*0.7)},${f1(ey*0.6)} ${f1(ex)},${f1(ey)}"/>`; });
  let ancT=''; anc.forEach(([n,s],i)=>{ const y=100+i*120; ancT+=`<text class="anc" text-anchor="middle" x="0" y="${y}" style="opacity:${1-i*0.15}">${n}</text><text class="anc2" text-anchor="middle" x="0" y="${y+30}" style="opacity:${1-i*0.15}">${s}</text>`; });

  const top=-(CY+B+420), W=A+520, bottom=620;
  const hills=`<path fill="var(--hill)" opacity=".35" d="M${-W*3},0 L${-W},-200 C${-W*0.7},-380 ${-W*0.45},-160 ${-W*0.25},-300 S${W*0.1},-90 ${W*0.3},-260 S${W*0.75},-120 ${W},-330 L${W*3},-200 V0Z"/>
     <path fill="var(--hill)" opacity=".55" d="M${-W*3},0 L${-W},-90 C${-W*0.8},-170 ${-W*0.55},-60 ${-W*0.35},-150 S${W*0.15},-30 ${W*0.45},-140 S${W*0.85},-40 ${W},-120 L${W*3},-90 V0Z"/>`;
  const svgS=`<svg class="tree far" viewBox="${-W} ${top} ${2*W} ${bottom-top}" xmlns="http://www.w3.org/2000/svg">
    <defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--sky2)"/><stop offset="1" stop-color="var(--sky1)"/></linearGradient>
      <radialGradient id="canopy"><stop offset="0" stop-color="var(--leaf2)" stop-opacity=".28"/><stop offset=".75" stop-color="var(--leaf1)" stop-opacity=".14"/><stop offset="1" stop-color="var(--leaf1)" stop-opacity="0"/></radialGradient>
      <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--ground)"/><stop offset="1" stop-color="var(--soil)" stop-opacity=".2"/></linearGradient></defs>
    <rect x="${-W*3}" y="${top*2}" width="${W*6}" height="${-top*2}" fill="url(#sky)"/>
    <circle cx="${f1(W*0.66)}" cy="${f1(top+460)}" r="280" fill="var(--sun)" opacity=".16"/>
    <text class="ttl" x="${f1(-W+200)}" y="${f1(top+640)}">儒林汪氏</text><text class="ttl2" x="${f1(-W+206)}" y="${f1(top+700)}">家 树 · OUR FAMILY TREE</text>
    ${hills}
    <ellipse cx="0" cy="${f1(-CY-B*0.15)}" rx="${f1(A*1.15)}" ry="${f1(B*1.2)}" fill="url(#canopy)"/>
    <rect x="${-W*3}" y="0" width="${W*6}" height="${bottom*3}" fill="url(#soil)"/>
    <path d="M${-W*3},0H${W*3}" stroke="var(--bark)" stroke-opacity=".25" stroke-width="2"/>
    ${roots}${ancT}
    <path class="br" d="M-46,6 C-28,-80 -24,-300 0,-${H} M46,6 C28,-80 24,-300 0,-${H}" stroke-width="16"/>
    ${clouds}${br}${thread}${leaves}${labels}${blossoms}${dlabels}
    <g data-id="0"><text class="dl" text-anchor="middle" x="0" y="-70" style="font-size:44px">汪路</text><text class="anc2" text-anchor="middle" x="0" y="-36" style="font-size:17px">儒林始祖 · 1104</text></g>
  </svg>`;
  return {svgS, focusKids:()=>{ const [x,y]=pt(ME.id); return [x,y-30]; }, bounds:[-W,top,2*W,bottom-top], crown:[-A*0.8,top+260,2*A*0.8,-top-260+330], H, Rmax};
}

/* ---------- 世系图 : readable chart ---------- */
function buildChart(){
  const DY=22; const lw = s => [...s].reduce((w,c)=>w+(c.charCodeAt(0)>255?13.2:7.6),0);
  // each generation's column is as wide as its longest name, so nothing is cut short
  const colW={}; P.forEach(p=>{ colW[p.gen]=Math.max(colW[p.gen]||0, lw(label(p))+(p.direct?6:0)); });
  const maxG=Math.max(...P.map(p=>p.gen)); const colX={1:40}; for(let g=2;g<=maxG;g++) colX[g]=colX[g-1]+colW[g-1]+46;
  const pos={}; let leaf=0;
  (function lay(id){ const p=P[id]; if(!p.kids.length){ pos[id]=leaf++*DY; } else { p.kids.forEach(lay); pos[id]=(pos[p.kids[0]]+pos[p.kids[p.kids.length-1]])/2; } })(0);
  const W=colX[maxG]+colW[maxG]+60, Hh=leaf*DY+60;
  let links='', dl='', nodes='';
  P.forEach(p=>{ if(!p.kids.length) return; const x=colX[p.gen], y=pos[p.id]+40, nx=colX[p.gen+1], mx=nx-16, sx=Math.min(x+lw(label(p))+14,mx);
    const ys=p.kids.map(k=>pos[k]+40);
    let d=`M${sx},${y}H${mx}M${mx},${Math.min(y,...ys)}V${Math.max(y,...ys)}`; ys.forEach(cy=>{ d+=`M${mx},${cy}H${nx-5}`; });
    links+=`<path class="lk" d="${d}"/>`;
    p.kids.forEach(k=>{ if(P[k].direct) dl+=`<path class="lk d" d="M${sx},${y}H${mx}V${pos[k]+40}H${nx-5}"/>`; });
  });
  P.forEach(p=>{ const cx=colX[p.gen], y=pos[p.id]+40;
    nodes+=`<circle cx="${cx}" cy="${y}" r="${p.direct?4:2.6}" class="${p.direct?'d':''}"/><text x="${cx+7}" y="${y+4.5}" data-id="${p.id}" class="${p.direct?'d':''}">${esc(label(p))}</text>`; });
  let gl=''; for(let g=1;g<=maxG;g++) gl+=`<text class="gl" x="${colX[g]-6}" y="20">${g}世${zibei(g)?' '+zibei(g):''}</text>`;
  return {svgS:`<svg class="chart" viewBox="0 0 ${W} ${Hh}" xmlns="http://www.w3.org/2000/svg"><g id="hl"></g>${links}${dl}${nodes}${gl}</svg>`,
    at:id=>[colX[P[id].gen], pos[id]+40], lw, W, Hh};
}

/* ---------- map container ---------- */
let mode=null, pz=null, model=null;
function showMap(m, id){
  if(mode!==m){
    mode=m; model = m==='tree'? buildTree() : buildChart();
    mapEl.innerHTML = model.svgS + `<div class="maphint">${m==='tree'
      ? '这是我们的家树：汪路公是树根，朱红梅花是直系，树梢开着思玥和乐康。放大可看见每个人的名字，点名字查看此人。<br><span style="font-family:var(--sans);font-size:12px">Zoom in to read every name · tap one to open</span>'
      : '世系图：拖动、双指缩放；点名字查看此人'}</div>
      <div class="mapui">${m==='tree'?'<button class="wide" id="mswap">世系图</button>':'<button class="wide" id="mswap">家树</button>'}
      <button id="zi" aria-label="放大">＋</button><button id="zo" aria-label="缩小">－</button>
      ${m==='tree'?'<button class="wide" id="zme">思玥 乐康</button>':'<button id="zme" title="直系">直</button>'}<button id="zall" title="全图">全</button></div>`;
    const svg=mapEl.querySelector('svg'), hint=mapEl.querySelector('.maphint');
    hint.style.transition='opacity .6s'; svg.addEventListener('pointerdown',()=>{ hint.style.opacity='0'; setTimeout(()=>hint.remove(),700); },{once:true});
    pz = panzoom(svg, m==='tree'? s=>svg.classList.toggle('far', s<0.95) : null);
    mapEl.querySelector('#zi').onclick=()=>pz.zoomAt(0.7); mapEl.querySelector('#zo').onclick=()=>pz.zoomAt(1/0.7);
    mapEl.querySelector('#mswap').onclick=()=>{ location.hash = m==='tree' ? '#/map/'+ME.id : '#/tree'; };
    mapEl.querySelector('#zall').onclick=()=>fitAllMap();
    mapEl.querySelector('#zme').onclick=()=> m==='tree' ? treeKids() : chartFocus(ME.id);
    showMap.fresh=true;
  }
  if(m==='tree'){ if(showMap.fresh) fitAllMap(); }
  else chartFocus(id!=null&&P[id]?id:ME.id);
  showMap.fresh=false;
}
function fitAllMap(){ if(mode==='tree'){ const r=mapEl.getBoundingClientRect();
    // on a tall phone screen frame the tree itself, on a wide screen show the whole scene
    const b = r.height>r.width ? model.crown : model.bounds; pz.fit(b[0]+b[2]/2, b[1]+b[3]/2, b[2], b[3]); }
  else pz.fit(model.W/2, model.Hh/2, model.W, model.Hh); }
function treeKids(){ const [x,y]=model.focusKids(); const r=mapEl.getBoundingClientRect(); pz.fit(x,y,Math.max(700,r.width/1.4),Math.max(700,r.height/1.4)); }
function chartFocus(id){ const p=P[id], [x,y]=model.at(id), r=mapEl.getBoundingClientRect(), s=Math.min(1.5,Math.max(1,r.width/600));
  pz.fit(x+Math.min(140, r.width/s/2-60), y, r.width/s, r.height/s);
  $('#hl').innerHTML=`<rect class="hl" x="${x-8}" y="${y-12}" rx="6" width="${model.lw(label(p))+22}" height="24"/>`; }

/* ---------- router ---------- */
let lastP=0;
function route(){
  const h=location.hash.slice(1)||'/'; const [path,qs]=h.split('?'); const seg=path.split('/').filter(Boolean);
  const tab = seg[0]==='p'?'p':(seg[0]==='tree'||seg[0]==='map')?'map':(seg[0]||'home');
  document.querySelectorAll('nav.tabs a').forEach(a=>a.classList.toggle('on',a.dataset.t===tab));
  if(tab==='map'){ view.classList.add('hidden'); mapEl.classList.remove('hidden');
    if(seg[0]==='tree'){ showMap('tree'); document.title='家树 · 儒林汪氏世系谱'; }
    else { showMap('chart', seg[1]!=null?+seg[1]:null); document.title='世系图 · 儒林汪氏世系谱'; }
    return; }
  mapEl.classList.add('hidden'); view.classList.remove('hidden');
  if(tab==='p'){ const id=+seg[1]||0; view.innerHTML=person(id); lastP=id; document.title=P[id]?P[id].name+' · 儒林汪氏世系谱':'儒林汪氏世系谱'; }
  else if(tab==='line'){ view.innerHTML=line(); document.title='直系 · 儒林汪氏世系谱'; }
  else if(tab==='search'){ const u=new URLSearchParams(qs||''); curGen=+u.get('g')||0; view.innerHTML=search(u.get('q'),curGen); setTimeout(doSearch,0); document.title='寻人 · 儒林汪氏世系谱'; }
  else { view.innerHTML=home(); document.title='儒林汪氏世系谱'; }
  window.scrollTo(0,0);
}
document.querySelector('nav a[data-t="p"]').addEventListener('click',e=>{ e.preventDefault(); location.hash='#/p/'+(lastP||ME.id); });
window.addEventListener('hashchange',route);
route();
</script>
